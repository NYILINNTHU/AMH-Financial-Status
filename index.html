<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMH Financial Status</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Pyidaungsu Font -->
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pyidaungsu', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20 antialiased">

    <!-- Mobile Header -->
    <header class="bg-indigo-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-tight">AMH Financial Status</h1>
                <p class="text-indigo-200 text-xs mt-0.5">ဘဏ္ဍာရေး အခြေအနေနှင့် ငွေစာရင်း</p>
            </div>
            <div class="flex gap-2 items-center">
                <button id="syncBtn" onclick="syncToGitHub()" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-sm flex items-center gap-1">
                    ☁️ Sync GitHub
                </button>
                <button onclick="exportCSV()" class="bg-indigo-700 hover:bg-indigo-600 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-sm">
                    📥 CSV
                </button>
                <button onclick="resetData()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-sm">
                    🔄 Reset
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-4 space-y-4">

        <!-- Summary Cards Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 flex flex-col justify-between">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">စုစုပေါင်း ဝင်ငွေ (Dr)</span>
                <p id="totalInflow" class="text-xl font-bold text-emerald-600 mt-1">0 MMK</p>
            </div>
            <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 flex flex-col justify-between">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">စုစုပေါင်း ထွက်ငွေ (Cr)
